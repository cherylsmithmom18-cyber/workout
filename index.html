<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Workout</title>
<meta name="application-name" content="My Workout">
<meta name="apple-mobile-web-app-title" content="My Workout">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#C8553D">
<meta name="description" content="A 12-week workout app with two programs: a 4-day intermediate Gym plan and a 3-day Travel / Home plan.">
<link id="manifest" rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22My%20Workout%22%2C%22short_name%22%3A%22My%20Workout%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23FFF8F1%22%2C%22theme_color%22%3A%22%23C8553D%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D'http%253A%252F%252Fwww.w3.org%252F2000%252Fsvg'%2520viewBox%253D'0%25200%2520512%2520512'%253E%253Crect%2520width%253D'512'%2520height%253D'512'%2520rx%253D'112'%2520fill%253D'%2523C8553D'%252F%253E%253C%252Fsvg%253E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">

<link id="touchicon" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%23C8553D'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FFF8F1; --card:#FFFFFF; --ink:#2E2422; --muted:#7A6A64; --line:#F0E2D6;
  --brand:#C8553D; --brand-d:#A9412C; --brand-l:#FBE4DC; --sun:#F6C26B; --sage:#5E8C6A; --sage-l:#E3F0E6; --plum:#6D4C7D;
  --r:18px; --shadow:0 2px 10px rgba(120,60,40,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
.print-only{display:none}

/* Header */
header.top{background:linear-gradient(135deg,#C8553D 0%,#D9744F 60%,#E99A5C 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 64px;}
header.top h1{margin:0;font-size:26px;letter-spacing:.2px}
header.top p{margin:4px 0 0;opacity:.95;font-size:15px}
.hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.icon-btn{background:rgba(255,255,255,.18);color:#fff;border-radius:14px;min-height:48px;padding:0 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.icon-btn:active{background:rgba(255,255,255,.3)}

/* Tabs */
nav.tabs{position:sticky;top:0;z-index:20;margin:-48px 12px 0;background:var(--card);border-radius:20px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(5,1fr);padding:5px;gap:4px}
nav.tabs button{min-height:56px;border-radius:14px;font-weight:700;font-size:14.5px;color:var(--muted);line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center}
nav.tabs button small{font-weight:500;font-size:11px;margin-top:2px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--brand);color:#fff}
main{padding:14px 12px 0;max-width:640px;margin:0 auto}
.panel[hidden]{display:none}

/* Generic cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:0 0 14px}
.card h2{margin:0 0 4px;font-size:21px}
.card h3{margin:0;font-size:19px}
.sub{color:var(--muted);font-size:14.5px;margin:0}
.pill{display:inline-block;background:var(--brand-l);color:var(--brand-d);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.pill.sage{background:var(--sage-l);color:var(--sage)}
.note{background:#FFF3D6;border-left:5px solid var(--sun);border-radius:12px;padding:12px 14px;font-size:15px;margin:0 0 14px}
.cheer{background:var(--sage-l);border-radius:14px;padding:12px 14px;color:#2F5A3B;font-size:15.5px;margin:0 0 14px}

/* Day progress */
.progress{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sage),#86B88F);border-radius:99px;transition:width .3s}
.progress b{font-size:15px;min-width:64px;text-align:right}

/* Checklists (warm-up / cool-down) */
.check{list-style:none;margin:10px 0 0;padding:0}
.check li{border-top:1px solid var(--line)}
.check label{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;min-height:52px;cursor:pointer}
.check input{width:26px;height:26px;flex:none;accent-color:var(--sage);margin:1px 0 0}
.check span b{display:block}
.check span small{color:var(--muted);font-size:14px}

/* Exercise card */
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-num{flex:none;width:38px;height:38px;border-radius:12px;background:var(--brand-l);color:var(--brand-d);display:flex;align-items:center;justify-content:center;font-weight:800}
.ex-title{flex:1}
.ex-done .ex-num{background:var(--sage);color:#fff}
details.how{margin:12px 0 4px;border:1px solid var(--line);border-radius:14px}
details.how summary{list-style:none;min-height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-weight:700;color:var(--brand-d);cursor:pointer}
details.how summary::-webkit-details-marker{display:none}
details.how summary::after{content:"＋";font-size:20px}
details.how[open] summary::after{content:"－"}
.how-body{padding:0 14px 12px}
.how-body h4{margin:12px 0 2px;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--plum)}
.how-body p,.how-body ul{margin:0;font-size:15.5px}
.how-body ul{padding-left:20px}
.how-body .easy{background:var(--sage-l);border-radius:10px;padding:8px 10px;margin-top:4px}

.row{display:flex;gap:10px;align-items:center}
.lbl{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:14px 0 6px}
.weight{display:flex;align-items:center;gap:8px}
.weight input{width:110px;min-height:52px;border:2px solid var(--line);border-radius:14px;padding:0 12px;font-size:22px;font-weight:700;background:#FFFCF9}
.weight input:focus{outline:none;border-color:var(--brand)}
.weight .unit{color:var(--muted);font-weight:600}
.hint{font-size:13.5px;color:var(--muted)}

/* Rep counter */
.reps{display:grid;grid-template-columns:72px 1fr 72px;gap:10px;align-items:stretch}
.reps .pm{min-height:72px;border-radius:18px;background:var(--brand-l);color:var(--brand-d);font-size:34px;font-weight:800}
.reps .pm:active{transform:scale(.96)}
.reps .count{min-height:72px;border-radius:18px;background:#FFFCF9;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none}
.reps .count b{font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.reps .count small{font-size:12px;color:var(--muted)}
.reps .count.inrange{border-color:var(--sage);background:var(--sage-l)}
.reps .count:active{transform:scale(.98)}

/* Sets */
.sets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.set{min-height:64px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.set small{font-weight:500;font-size:12.5px;color:var(--muted)}
.set.done{background:var(--sage);border-color:var(--sage);color:#fff}
.set.done small{color:#E8F4EA}

/* Rest timer */
.rest{margin-top:14px;background:#FBF3EC;border-radius:16px;padding:12px}
.rest-top{display:flex;align-items:center;justify-content:space-between}
.rest .time{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
.rest.running .time{color:var(--brand)}
.rest.finished .time{color:var(--sage)}
.seg{display:inline-flex;background:#fff;border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{min-height:44px;min-width:56px;border-radius:10px;font-weight:700;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--plum);color:#fff}
.rest-btns{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:10px}
.btn{min-height:54px;border-radius:14px;font-weight:700;font-size:17px;background:var(--brand);color:#fff}
.btn:active{background:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.sage{background:var(--sage)}
.btn.wide{width:100%}

/* Cardio */
.cardio-time{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 2px;color:var(--plum)}
.cardio-phase{text-align:center;font-weight:700;color:var(--brand-d);min-height:24px}
.ring{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.ring i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--plum),#A47BB5)}

.guide h3{margin:16px 0 4px;font-size:18px;color:var(--brand-d)}
.guide p,.guide ul{margin:0 0 6px;font-size:16px}
.guide ul{padding-left:20px}
.footer-actions{display:grid;gap:10px;margin:6px 0 20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(calc(100% + 60px));background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;transition:transform .25s;z-index:50;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}

/* Week selector */
.weekcard{padding:14px}
.wk-row{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}
.wk-arrow{min-height:56px;border-radius:16px;background:var(--brand-l);color:var(--brand-d);font-size:30px;font-weight:800;line-height:1}
.wk-arrow:disabled{opacity:.35}
.wk-mid{text-align:center}
.wk-title{font-size:23px;font-weight:800;margin:0 0 4px}
.wk-chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0 4px}
.wk-chips button{min-height:48px;border-radius:12px;font-weight:800;font-size:16px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.wk-chips button small{font-size:10.5px;font-weight:600;opacity:.85}
.wk-chips .p1{background:var(--brand-l);color:var(--brand-d)}
.wk-chips .p2{background:#FFF0D1;color:#8A5A00}
.wk-chips .p3{background:#EFE4F4;color:var(--plum)}
.wk-chips button[aria-checked="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.wk-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:2px 2px 0}
.wk-legend .dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.dot.p1{background:#F3B9A8}.dot.p2{background:#F2CF7E}.dot.p3{background:#C7A9D6}
.wk-focus{margin:10px 0 0;font-size:15.5px;background:#FBF3EC;border-radius:12px;padding:10px 12px}
.pill.plum{background:#EFE4F4;color:var(--plum)}
.pill.sun{background:#FFF0D1;color:#8A5A00}
.pill.deload{background:#E3EEF7;color:#2D5F86}
.pills{margin:8px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.wk-prompt{margin-top:12px;background:var(--sage-l);border:2px solid var(--sage);border-radius:16px;padding:12px}
.wk-prompt p{margin:0 0 10px;font-weight:600;color:#2F5A3B}
.wk-prompt .row2{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.ssnote{background:#F5EEF8;border-radius:12px;padding:8px 12px;font-size:14.5px;margin:10px 0 0;color:#4F3560}
.hint.up{color:#2F6B3E;font-weight:700;background:var(--sage-l);border-radius:10px;padding:6px 10px;margin-top:6px;font-size:14.5px}
.hint.last{margin-top:6px;font-size:14.5px;color:var(--ink)}
nav.tabs button .ok{color:var(--sage);font-weight:800}
nav.tabs button[aria-selected="true"] .ok{color:#fff}
.btn.done-day{background:var(--sage-l);color:#2F5A3B;border:2px solid var(--sage)}
.phase-tbl{width:100%;border-collapse:collapse;font-size:14.5px;margin:6px 0 8px}
.phase-tbl th,.phase-tbl td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}

.cmove{border-top:1px solid var(--line);padding:12px 0 4px;margin-top:10px}
.cm-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cmsets .set{min-height:56px}
.srow{display:flex;align-items:center;gap:8px}
.srow label{flex:1}
.holdbtn{flex:none;min-width:60px;min-height:56px;border-radius:14px;background:var(--sage-l);color:#2F5A3B;font-size:20px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.holdbtn small{font-size:11.5px;font-weight:700;margin-top:3px}
.rest.hold{margin:12px 0 4px}
.rest.hold.running .time{color:#2D5F86}

/* Program toggle */
.prog{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(255,255,255,.18);padding:5px;border-radius:18px;margin-top:12px}
.prog button{min-height:56px;border-radius:14px;color:#fff;font-weight:800;font-size:16.5px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.prog button small{font-weight:600;font-size:11.5px;opacity:.9;margin-top:2px}
.prog button[aria-checked="true"]{background:#fff;color:var(--brand-d);box-shadow:0 2px 8px rgba(0,0,0,.12)}
nav.tabs.six{grid-template-columns:repeat(6,1fr);gap:3px;padding:4px}
nav.tabs.six button{font-size:13px;border-radius:12px}
nav.tabs.six button small{font-size:10px}
.carry{font-size:13.5px;color:#4A5D3F;background:#EEF4E6;border-radius:10px;padding:6px 10px;margin:8px 0 0}
.ssnote.rpe{background:#FFF3D6;color:#5C4300}
ul.tight{margin:6px 0 0;padding-left:20px;font-size:15px}
ul.tight li{margin:3px 0}
.steps-note{font-size:14.5px;margin:8px 0 0;color:var(--muted)}

/* ================= PRINT: CURRENT week on ONE letter page ================= */
@media print{
  @page{size:letter portrait;margin:0.3in 0.35in}
  html,body{background:#fff !important}
  body{font:8pt/1.2 Arial,Helvetica,sans-serif;color:#000;padding:0}
  .screen-only,header.top,nav.tabs,main,.toast{display:none !important}
  .print-only{display:block !important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:none !important}
  #printSheet h1{font-size:14pt;margin:0;color:#A9412C}
  #printSheet .ph{display:flex;justify-content:space-between;align-items:flex-end;gap:10pt;border-bottom:2pt solid #C8553D;padding-bottom:3pt;margin-bottom:4pt}
  #printSheet .ph p{margin:1pt 0 0;font-size:8pt}
  #printSheet .doc{border:1pt solid #E0A85A;background:#FFF5E0;padding:2pt 6pt;margin:0 0 4pt;font-size:7.6pt}
  #printSheet table{width:100%;border-collapse:collapse;margin:0 0 3pt;table-layout:fixed}
  #printSheet caption{text-align:left;font-weight:700;font-size:9.4pt;color:#fff;background:#C8553D;padding:1.5pt 6pt}
  #printSheet th,#printSheet td{border:0.6pt solid #B9A79E;padding:1.2pt 3pt;vertical-align:top;font-size:7.3pt;line-height:1.18}
  #printSheet th{background:#FBE4DC;font-size:7.2pt;text-align:left}
  #printSheet td.ex{font-weight:700}
  #printSheet tr{height:15pt}
  #printSheet .cols{display:grid;grid-template-columns:1fr 1fr;gap:6pt}
  #printSheet .box{border:0.8pt solid #B9A79E;padding:2.5pt 6pt}
  #printSheet .box h4{margin:0 0 1pt;font-size:8.4pt;color:#A9412C}
  #printSheet .box p,#printSheet .box ul{margin:0;font-size:7.5pt}
  #printSheet .box ul{padding-left:11pt}
  #printSheet .foot{text-align:center;font-size:7.4pt;margin-top:3pt;color:#555}
  #printSheet.gym h1{font-size:13pt}
  #printSheet.gym .ph{padding-bottom:2pt;margin-bottom:3pt}
  #printSheet.gym .ph p{font-size:7.4pt}
  #printSheet.gym table{margin:0 0 2.5pt}
  #printSheet.gym caption{font-size:8.6pt;padding:1pt 6pt}
  #printSheet.gym th,#printSheet.gym td{font-size:6.7pt;line-height:1.12;padding:0.8pt 2.5pt}
  #printSheet.gym tr{height:auto}
  #printSheet.gym td{height:12pt}
  #printSheet.gym .box{padding:2pt 5pt}
  #printSheet.gym .box h4{font-size:7.8pt}
  #printSheet.gym .box p,#printSheet.gym .box ul{font-size:6.9pt}
  #printSheet.gym .foot{font-size:6.8pt;margin-top:2pt}
}
</style>
</head>
<body>

<header class="top screen-only">
  <div class="hdr-row">
    <div>
      <h1>My Workout</h1>
      <p id="greet">Welcome back! One rep at a time. 💪</p>
    </div>
    <button class="icon-btn" id="printBtn" aria-label="Print this week's one-page plan">🖨️ Print</button>
  </div>
  <div class="prog" id="progToggle" role="radiogroup" aria-label="Choose program">
    <button role="radio" data-prog="gym" aria-checked="true">🏋️ Gym<small>4 days · intermediate</small></button>
    <button role="radio" data-prog="travel" aria-checked="false">🧳 Travel / Home<small>3 days · dumbbells</small></button>
  </div>
</header>

<nav class="tabs screen-only" role="tablist" aria-label="Workout days">
  <button role="tab" data-tab="d1" aria-selected="true">Day 1<small>Lower</small></button>
  <button role="tab" data-tab="d2" aria-selected="false">Day 2<small>Cardio+Up</small></button>
  <button role="tab" data-tab="d3" aria-selected="false">Day 3<small>Lower+</small></button>
  <button role="tab" data-tab="stretch" aria-selected="false">Stretch<small>Rest day</small></button>
  <button role="tab" data-tab="guide" aria-selected="false">Guide<small>Tips</small></button>
</nav>

<main class="screen-only" id="app">
  <section class="card weekcard" id="weekCard" aria-label="Week selector">
    <div class="wk-row">
      <button class="wk-arrow" id="wkPrev" aria-label="Previous week">‹</button>
      <div class="wk-mid">
        <div class="wk-title" id="wkTitle">Week 1 of 12</div>
        <div class="pills" style="justify-content:center;margin:0" id="wkPills"></div>
      </div>
      <button class="wk-arrow" id="wkNext" aria-label="Next week">›</button>
    </div>
    <div class="wk-chips" id="weekSel" role="radiogroup" aria-label="Choose your week (Week 1 to 12)"></div>
    <div class="wk-legend" id="wkLegend"><span><i class="dot p1"></i>1–4 Rebuild</span><span><i class="dot p2"></i>5–8 Build strength</span><span><i class="dot p3"></i>9–12 Shape &amp; tone</span></div>
    <p class="wk-focus" id="wkFocus"></p>
    <div class="wk-prompt" id="wkPrompt" hidden></div>
  </section>
  <section class="panel" id="panel-d1"></section>
  <section class="panel" id="panel-d2" hidden></section>
  <section class="panel" id="panel-d3" hidden></section>
  <section class="panel" id="panel-d4" hidden></section>
  <section class="panel" id="panel-stretch" hidden></section>
  <section class="panel guide" id="panel-guide" hidden></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ONE-PAGE PRINTABLE PLAN (generated from the selected week) -->
<div class="print-only" id="printSheet"></div>

<script>
(function(){
"use strict";

  }

  var li=findItem(L.w,L.d,it.id), top=!!li && !isDeload(L.w);
  if(top){ for(var i=0;i<li.sets;i++){ if(!L.st.sets[i]||(L.st.setReps&&L.st.setReps[i]||0)<li.hi){ top=false; break; } } }
  if(top){
    if(x.region==="lower") return {t:"⬆️ "+s+". You hit the top of the range on every set — add 2.5–5 lb: try "+fw(L.v+2.5)+"–"+fw(L.v+5)+" lb.",c:"up"};
    if(x.region==="upper") return {t:"⬆️ "+s+". You hit the top of the range on every set — add 2.5 lb: try "+fw(L.v+2.5)+" lb.",c:"up"};
    return {t:"⬆️ "+s+". Top of the range — try a little longer or a harder version.",c:"up"};
  }
  if(li && phaseOf(L.w)<phaseOf(w) && it.hi<li.hi) return {t:s+" → fewer reps this phase, so try a small step up ("+fw(L.v+(x.region==="lower"?5:2.5))+" lb) if form stays clean.",c:"last"};
  if(d==="d3" && L.d==="d1" && L.w===w) return {t:s+" → if Day 1 felt good, try "+fw(L.v+2.5)+"–"+fw(L.v+5)+" lb; same weight is a win too.",c:"last"};
  return {t:s+" → stay here until you hit "+it.hi+" reps on every set, then go up.",c:"last"};
}

function $(s,r){return (r||document).querySelector(s);}

function el(tag,attrs,html){var e=document.createElement(tag); if(attrs) for(var k in attrs){ if(k==="class") e.className=attrs[k]; else e.setAttribute(k,attrs[k]); } if(html!=null) e.innerHTML=html; return e;}

function fmt(s){ s=Math.max(0,Math.ceil(s)); var m=Math.floor(s/60), x=s%60; return m+":"+(x<10?"0":"")+x; }

/* Sound + vibration */
var actx=null;
function unlockAudio(){ try{ if(!actx){ var C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); } if(actx&&actx.state==="suspended") actx.resume(); }catch(e){} }
document.addEventListener("pointerdown",unlockAudio,{passive:true});
function beep(times){
  times=times||3;
  try{ unlockAudio(); if(!actx) return; var t0=actx.currentTime+0.02;
    for(var i=0;i<times;i++){ var o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=(i===times-1)?1175:880;
      g.gain.setValueAtTime(0.0001,t0+i*0.32); g.gain.exponentialRampToValueAtTime(0.5,t0+i*0.32+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+i*0.32+0.26);
      o.connect(g); g.connect(actx.destination); o.start(t0+i*0.32); o.stop(t0+i*0.32+0.28); }
  }catch(e){}
}
function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

/* Wake lock */
var wakeLock=null, wakeUsers=0;
function wakeOn(){ wakeUsers++; try{ if(!wakeLock&&navigator.wakeLock) navigator.wakeLock.request("screen").then(function(w){wakeLock=w; w.addEventListener&&w.addEventListener("release",function(){wakeLock=null;});}).catch(function(){}); }catch(e){} }
function wakeOff(){ wakeUsers=Math.max(0,wakeUsers-1); if(!wakeUsers&&wakeLock){ try{wakeLock.release();}catch(e){} wakeLock=null; } }

/* Timer (accurate even if the phone throttles) */
function Timer(len,onTick,onDone){ this.len=len; this.left=len; this.end=0; this.running=false; this.iv=null; this.onTick=onTick; this.onDone=onDone; }
Timer.prototype.start=function(){ if(this.running) return; if(this.left<=0) this.left=this.len; this.end=Date.now()+this.left*1000; this.running=true; var me=this; wakeOn(); this.iv=setInterval(function(){me.tick();},250); this.tick(); };
Timer.prototype.pause=function(){ if(!this.running) return; this.left=Math.max(0,(this.end-Date.now())/1000); this.running=false; clearInterval(this.iv); wakeOff(); this.onTick(this); };
Timer.prototype.reset=function(len){ if(this.running){ clearInterval(this.iv); wakeOff(); } this.running=false; if(len) this.len=len; this.left=this.len; this.onTick(this); };
Timer.prototype.tick=function(){ if(!this.running) return; this.left=Math.max(0,(this.end-Date.now())/1000); this.onTick(this); if(this.left<=0){ this.running=false; clearInterval(this.iv); wakeOff(); this.onDone(this); } };
var allTimers=[];
function stopAllTimers(){ allTimers.forEach(function(t){ if(t.running) t.pause(); }); allTimers=[]; }
document.addEventListener("visibilitychange",function(){ if(!document.hidden) allTimers.forEach(function(t){t.tick();}); });

  if(P.deload) p.appendChild(el("div",{class:"note"},PROGRAM==="gym"?(P.test?"<b>🏁 Test &amp; deload week:</b> one test set on the main lifts (max clean reps at your best Phase 3 weight, 1 in reserve), then 2 easy sets of everything else.":"<b>🌿 Deload week:</b> 2 sets of each move, about 10% lighter, RPE 6. Planned recovery, not a step back."):"<b>🌿 Deload week (lighter):</b> 2 sets of each move, same weights as last week. This is planned recovery — not a step back."));
  p.appendChild(el("div",{class:"cheer"},"🌱 "+esc(D.cheer)));
  p.appendChild(PROGRAM==="gym"?checklist(w,day,"warm",GWARM,"Warm-up · ~8 min","Raise the temperature, open hips & upper back, wake up single-leg balance"):checklist(w,day,"warm",WARMUP,"Warm-up · 5 min","Get your body warm and joints moving"));
  if(D.cardio&&!D.cardioAfter) p.appendChild(cardioCard(w,day,D.cardio));
  var n=0;
  D.items.forEach(function(it){ p.appendChild(exerciseCard(w,day,it,it.ss?0:n)); if(!it.ss) n++; });
  if(D.cardio&&D.cardioAfter) p.appendChild(cardioCard(w,day,D.cardio));
  var cc=coreCard(w,day); if(cc) p.appendChild(cc);
  p.appendChild(stretchCard(dayState(w,day),day));
  var fa=el("div",{class:"footer-actions"}), lbl=D.title.split(" · ")[0];
  var db=el("button",{class:"btn wide sage",id:"done-"+day});
  db.addEventListener("click",function(){ var ds=dayState(w,day); ds.complete=ds.complete?0:1; if(!ds.complete) weekState(w).promptDismissed=0; save(); refreshDayButton(w,day); renderWeekCard();
    if(ds.complete){ if(weekComplete(w)){ window.scrollTo(0,0); toast("🎉 Week "+w+" complete!"); } else toast("✓ "+lbl+" complete — well done!"); } });
  fa.appendChild(db);
  var rb=el("button",{class:"btn ghost wide"},"↺ Reset "+lbl+" (Week "+w+")");
  rb.addEventListener("click",function(){
    if(!confirm("Clear sets, reps, core, stretch checklist"+(D.cardio?" and cardio timer":"")+" for "+lbl+" of Week "+w+"? (Weights are kept so you remember them.)")) return;
    var W=weekState(w), old=W[day]||{}, keep={};
    D.items.forEach(function(it){ var s=old.ex&&old.ex[it.id]; if(s) keep[it.id]={w:s.weight,r:s.restLen}; });
    stopAllTimers(); W[day]=null; dayState(w,day);
    D.items.forEach(function(it){ if(keep[it.id]){ var s=exState(w,day,it.id,it.sets); s.weight=keep[it.id].w; s.restLen=keep[it.id].r; } });
    save(); renderAll(); showTab(day,true); toast("Fresh start — you've got this!");
  });
  fa.appendChild(rb); p.appendChild(fa);
  refreshDayButton(w,day);
  updateProgress(w,day);
}

function refreshHints(){
  var w=state.week, P=plan(w);
  DORDER.forEach(function(d){ P.days[d].items.forEach(function(it){ var h=$("#"+d+"-"+it.id+" .prevhint"); if(!h) return; var r=hintFor(w,d,it); h.textContent=r.t; h.className="hint prevhint "+r.c; }); });
}

/* ================= Guide ================= */
function renderGuide(){
  if(PROGRAM==="gym") return gGuide();
  var w=state.week;
  $("#panel-guide").innerHTML=
  '<div class="note"><b>🩺 Please check with your doctor before starting</b> — especially if you have heart, blood-pressure, joint, bone-density or other health concerns. Stop if you feel sharp pain, chest pain, dizziness or unusual shortness of breath.</div>'+
  '<div class="card">'+
  '<h2>Travel / Home plan · 12 weeks</h2><p class="sub">Dumbbell-friendly, for hotel gyms, travel and home. 3 days a week with a rest day between, e.g. Mon / Wed / Fri. You\'re on <b>Week '+w+'</b>. Use the week selector at the top to switch weeks.</p>'+
  '<h3>🗺️ The 3 phases</h3>'+
  '<table class="phase-tbl"><tr><th>Phase</th><th>What it\'s about</th></tr>'+
  [1,2,3].map(function(i){ return '<tr><td><b>'+i+' · '+PHASES[i].name+'</b><br><span class="sub">'+PHASES[i].weeks+'</span></td><td>'+PHASES[i].what+'</td></tr>'; }).join("")+'</table>'+
  '<ul><li><b>Phase 1 – Rebuild:</b> Day 1 lower body (goblet squat, Romanian deadlift, hip thrust, walking lunges); Day 2 20 min cardio + push-ups, rows, overhead press; Day 3 = Day 1, a little heavier.</li>'+
  '<li><b>Phase 2 – Build strength:</b> main lifts 3 × 8–10 with a bit more weight and 90 sec rest. New: <b>step-ups</b> (Day 1), <b>dumbbell chest press</b> (Day 2), <b>glute kickbacks</b> (Day 3). Cardio 25 min with intervals (1 min harder / 2 min easy).</li>'+
  '<li><b>Phase 3 – Shape &amp; tone:</b> 4 sets of 8–12 on squats, deadlifts and hip thrusts. Upper body in <b>supersets</b> (chest press + row, overhead press + lateral raise). Cardio 30 min, steady then intervals. Finishers: <b>glute bridge pulses</b> (Day 1) and <b>plank</b> (Day 3).</li></ul>'+
  '<h3>🌿 Deload weeks (Week 4 and Week 8)</h3><p>Every 4th week is planned to be lighter: <b>about 2 sets of each move at the same weights</b> as the week before, and steady cardio. It lets muscles, joints and energy catch up, so you come back stronger for the next phase. It\'s part of the plan — not a step back!</p>'+
  '<h3>📈 How to progress (double progression)</h3><ul><li>Each exercise has a rep range, e.g. 8–10 or 10–12.</li><li>Start at a weight where you can do the low end with clean form.</li><li>Add reps from session to session until you hit the <b>top of the range on every set</b>.</li><li>Then go up the smallest step: <b>lower body +2.5–5 lb, upper body +2.5 lb</b>, and work back up from the bottom of the range.</li><li>The app shows <b>“Last time: X lb”</b> under every weight box and tells you when it\'s time to go up — just use the rep counter and tap each set when you finish it.</li><li>New phase, fewer reps? It\'s fine to try a small step heavier.</li></ul>'+
  '<h3>🔗 Supersets &amp; finishers</h3><p><b>Superset:</b> do one set of move 1, a short 30-sec break, one set of move 2, then rest 90 sec and repeat. <b>Finisher:</b> a short, burning hold or pulse at the end — use the counter to track seconds.</p>'+
  '<h3>✅ Finishing a week</h3><p>Tap <b>“Mark Day complete”</b> at the bottom of each day (it also happens automatically when every set is ticked). When all 3 days are done, the app offers to move you to the next week. Your current week and every week\'s log are saved on this phone, separately for each week.</p>'+
  '<h3>◎ Core block (end of every workout, 10–12 min)</h3><p>Gentle, postpartum-safe core that rebuilds your deep tummy muscles from the inside out — <b>no crunches or sit-ups early on</b>.</p><ul><li><b>Phase 1:</b> belly breathing with a deep-core brace, dead bugs, bird dogs, glute bridge march, modified side plank.</li><li><b>Phase 2:</b> dead bug with arm/leg extension, forearm plank (knees → full), side plank, Pallof press, slow mountain climbers.</li><li><b>Phase 3:</b> plank shoulder taps, side plank with hip dips, weighted dead bug holds, farmer\'s carry, controlled reverse crunch.</li></ul>'+
  '<div class="note" style="margin:6px 0 8px"><b>Watch your belly:</b> avoid any exercise that makes your belly <b>dome or cone</b> (a ridge down the middle) — choose the easier option instead. If you notice doming, leaking or pelvic heaviness, please see a <b>pelvic floor physical therapist</b>. It\'s very common after having kids, and very treatable.</div>'+
  '<h3>🧘 Stretching (10 min)</h3><p>After every workout — and on rest days from the <b>Stretch</b> tab: hip flexors, hamstrings, figure-4 glutes, doorway chest, cat-cow, child\'s pose and thoracic rotation. Tap ⏱ to start a 30- or 45-second hold timer; it ticks the box for you (and tells you when to switch sides).</p>'+
  '<h3>🔥 Leaner &amp; stronger: simple habits</h3><ul><li><b>Protein:</b> about 100–120 g a day, spread across your meals (e.g. 25–35 g at each meal plus a snack — eggs, Greek yogurt, chicken, fish, beans, cottage cheese).</li><li><b>Move daily:</b> aim for 7,000–10,000 steps a day — walking adds up.</li><li><b>Sleep:</b> 7–9 hours helps recovery, appetite and energy.</li><li><b>Lifting is the main driver.</b> Getting stronger week by week is what builds lean, firm muscle; cardio supports it.</li><li><b>Only a small calorie deficit, and only if needed.</b> No crash dieting — it costs muscle and energy.</li><li><b>Be patient:</b> expect 4–8 weeks before you see clear change.</li><li><b>Track more than the scale:</b> a monthly waist measurement and progress photos (same light, same outfit) show fat loss and muscle gain that the scale can hide.</li></ul>'+
  '<p class="sub" style="margin:4px 0 8px"><i>This is general information, not medical advice. Please check with your doctor before changing your exercise or eating habits.</i></p>'+
  '<h3>⏱️ Rest between sets</h3><p>Phase 1: 60–90 sec (90 for squats, deadlifts and lunges). Phase 2: 90 sec on the main lifts. Take longer if you need it — that\'s okay!</p>'+
  '<h3>🏋️ Choosing a starting weight</h3><p>Pick a weight where the <b>last 2 reps feel challenging but your form stays clean</b>. If you can\'t reach the bottom of the range with good form, go lighter. Start light — you can always add.</p>'+
  '<h3>💛 Listen to your body</h3><ul><li>Mild muscle soreness for a day or two is normal, especially in the first weeks and when new moves arrive.</li><li>Breathe out and gently brace your deep core on every lift — it protects your back and pelvic floor.</li><li>Sharp pain or joint pain means stop and choose the easier option shown on each card.</li><li>Breathe out on the effort, never hold your breath.</li><li>Drink water and include protein with your meals to help muscles recover.</li><li>Strength training is fantastic for bones, balance and energy — you\'re investing in yourself.</li></ul>'+
  '<h3>📱 Install on your phone</h3><p>In Chrome, tap the ⋮ menu → <b>Add to Home screen</b>. It\'ll appear as “My Workout”. Your progress is saved on this phone.</p>'+
  '</div><div class="footer-actions"><button class="btn wide" id="printBtn2">🖨️ Print Week '+w+' plan (1 page)</button></div>';
  $("#printBtn2").addEventListener("click",doPrint);
}

/* ================= Print sheet (current week) ================= */

  var w=state.week, P=plan(w), ph=P.phase;
  var h='<div class="ph"><div><h1>My Workout &mdash; Travel / Home &middot; Week '+w+' of 12</h1>'+
    '<p><b>Phase '+ph+': '+PH()[ph].name+'</b> ('+PH()[ph].weeks+')'+(P.deload?' &middot; <b>DELOAD WEEK &mdash; lighter: about 2 sets, same weights</b>':'')+' &middot; 3 days/week, rest day between.</p>'+
    '<p><b>This week\'s focus:</b> '+esc(FOC()[w-1])+'</p></div><p style="text-align:right;white-space:nowrap">Week of: ____________</p></div>'+
    '<div class="doc"><b>Safety:</b> check with your doctor before starting, especially with heart, blood-pressure, joint or bone-density concerns. Stop if you feel sharp pain, chest pain, dizziness or unusual shortness of breath.</div>';
  var cg='<colgroup><col style="width:19%"><col style="width:12%"><col style="width:8%"><col style="width:39%"><col style="width:8%"><col style="width:10%"><col style="width:4%"></colgroup>';
  DORDER.forEach(function(d){ var D=P.days[d];
    h+='<table><caption>'+esc(D.title.split(" · ")[0].toUpperCase())+' &mdash; '+esc(D.psub)+'</caption>'+cg+'<tr><th>Exercise</th><th>Sets &times; reps</th><th>Rest</th><th>Key cues &middot; easier option</th><th>Last time</th><th>Weight used (lb)</th><th>&check;</th></tr>';
    if(D.cardio) h+='<tr><td class="ex">Cardio: bike or incline treadmill</td><td>'+D.cardio.min+' min</td><td>&ndash;</td><td>'+esc(D.cardio.print)+'</td><td></td><td></td><td></td></tr>';
    D.items.forEach(function(it){ var x=EX[it.id], L=lastLog(it.id,w,d);
      h+='<tr><td class="ex">'+(it.ss?'['+it.ss+'] ':'')+esc(x.name.replace(" (finisher)",""))+(it.finisher?' <i>(finisher)</i>':'')+(it.isNew&&phaseOf(w)>1&&w%4===1?' <i>NEW</i>':'')+'</td><td>'+esc(target(it))+'</td><td>'+(it.ss&&it.ss[1]==="1"?'30s &rarr; '+it.ss[0]+'2':it.rest+'s')+'</td><td>'+esc(x.pc)+'</td><td>'+(L?fw(L.v)+' lb':'')+'</td><td></td><td></td></tr>'; });
    h+='<tr><td class="ex">Core block (10&ndash;12 min)</td><td>'+coreMoves(w,d).length+' moves</td><td>&ndash;</td><td colspan="4">'+coreMoves(w,d).map(function(m){return esc(m.name.replace(/ \(.*\)/,""))+' '+esc(coreDose(w,m).replace(" per side","/side"));}).join(" &bull; ")+'</td></tr>';
    h+='</table>';
  });
  var rules={1:'<li><b>Rest</b> 60&ndash;90 sec (90 for squats, deadlifts, lunges).</li><li><b>Progress:</b> when every set hits 12 reps with good form, add 2.5&ndash;5 lb (lower) or 2.5 lb (upper).</li><li><b>Day 3:</b> Day 1 moves, a little heavier if Day 1 felt good.</li>',
             2:'<li><b>Rest</b> 90 sec on main lifts, 60 sec on step-ups/kickbacks.</li><li><b>Heavier, fewer reps (8&ndash;10).</b> Hit 10 on every set &rarr; add 2.5&ndash;5 lb lower / 2.5 lb upper.</li><li><b>Intervals:</b> &ldquo;harder&rdquo; = a little breathless (7/10).</li>',
             3:'<li><b>4 sets</b> of 8&ndash;12 on squats, deadlifts, hip thrusts (rest 90 sec).</li><li><b>Supersets:</b> A1 &rarr; 30 sec &rarr; A2 &rarr; rest 90 sec, repeat. Same for B.</li><li><b>Finisher:</b> track seconds held. Hit the top of the range &rarr; add a small step.</li>'}[ph];
  if(P.deload) rules='<li><b>Deload week:</b> about 2 sets of each move, same weights as last week, steady cardio.</li><li>Leave every set feeling like you had 3&ndash;4 more reps in you.</li><li>Next week starts a new phase &mdash; come back fresh!</li>';
  h+='<div class="cols"><div class="box"><h4>Warm-up (5 min, every day)</h4><p>3 min easy bike or marching &rarr; 10 bodyweight squats &rarr; 10 glute bridges &rarr; 10 arm circles each way &rarr; 10 hip hinges.</p>'+
     '<h4 style="margin-top:2pt">Stretch routine (10 min, after every workout &amp; on rest days)</h4><p>Hold 30&ndash;45 sec, no bouncing: hip flexors* &bull; hamstrings* &bull; figure-4 glutes* &bull; doorway chest &bull; cat-cow &bull; child\'s pose &bull; thoracic rotation* (*each side).</p></div>'+
     '<div class="box"><h4>This week\'s rules</h4><ul>'+rules+'<li><b>Core:</b> no crunches/sit-ups early on. Belly domes or cones? Use the easier option. Doming or leaking &rarr; see a pelvic floor PT.</li><li>Sharp or joint pain = stop and use the easier option.</li></ul></div></div>'+
     '<div class="foot">Consistency beats intensity &mdash; one rep at a time. You\'ve got this!</div>';

function doPrint(){ renderPrint(); window.print(); }
window.addEventListener("beforeprint",renderPrint);

function renderAll(){ var w=state.week; if(DORDER.indexOf("d4")<0) $("#panel-d4").innerHTML=""; DORDER.forEach(function(d){ renderDay(w,d); }); renderStretchTab(); renderGuide(); renderWeekCard(); renderPrint(); }

/* Tabs */
function showTab(name,keepScroll){
  if(!(name==="guide"||name==="stretch"||DAYS_LBL[name])) name="d1";
  $$("nav.tabs button").forEach(function(b){ b.setAttribute("aria-selected",String(b.dataset.tab===name)); });
  ["d1","d2","d3","d4","stretch","guide"].forEach(function(n){ $("#panel-"+n).hidden=(n!==name); });
  refreshHints();
  state.tab=name; save(); if(!keepScroll) window.scrollTo(0,0);
}
function buildTabs(){
  var nav=$("nav.tabs"), G=(PROGRAM==="gym");
  var list=DORDER.map(function(d){ return [d,DAYS_LBL[d][0],DAYS_LBL[d][1]]; }).concat([["stretch",G?"Recover":"Stretch",G?"Rest days":"Rest day"],["guide","Guide",G?"Plan":"Tips"]]);
  nav.innerHTML=""; nav.classList.toggle("six",list.length>5); nav.setAttribute("aria-label",(G?"Gym":"Travel / Home")+" workout days");
  list.forEach(function(t){ var b=el("button",{role:"tab","data-tab":t[0],"aria-selected":"false"},esc(t[1])+"<small>"+esc(t[2])+"</small>"); b.addEventListener("click",function(){ showTab(t[0]); }); nav.appendChild(b); });
}
function drawToggle(){ $$("#progToggle button").forEach(function(b){ b.setAttribute("aria-checked",String(b.dataset.prog===PROGRAM)); }); }
function switchProgram(p){
  if(p===PROGRAM||(p!=="gym"&&p!=="travel")) return;
  stopAllTimers(); save();
  PROGRAM=p; try{ localStorage.setItem(PKEY,p); }catch(e){}
  applyProgram(); state=load(); save();
  buildTabs(); drawToggle(); renderAll(); showTab(state.tab||"d1");
  toast(p==="gym"?"🏋️ Gym program · Week "+state.week:"🧳 Travel / Home program · Week "+state.week);
}
$$("#progToggle button").forEach(function(b){ b.addEventListener("click",function(){ switchProgram(b.dataset.prog); }); });
buildTabs(); drawToggle();
$("#printBtn").addEventListener("click",doPrint);
$("#wkPrev").addEventListener("click",function(){ setWeek(state.week-1); });
$("#wkNext").addEventListener("click",function(){ setWeek(state.week+1); });

/* Greeting */
(function(){ var h=new Date().getHours(); $("#greet").textContent=(h<12?"Good morning":h<17?"Good afternoon":"Good evening")+"! One rep at a time. 💪"; })();

/* App icon + absolute-URL manifest for "Add to Home screen" */
function makeIcon(size){
  var cv=document.createElement("canvas"); cv.width=cv.height=size; var g=cv.getContext("2d"); if(!g) return null; var s=size/512;
  var grd=g.createLinearGradient(0,0,size,size); grd.addColorStop(0,"#C8553D"); grd.addColorStop(1,"#E99A5C"); g.fillStyle=grd; g.fillRect(0,0,size,size);
  g.fillStyle="#FFF8F1";
  function rr(x,y,w,h,r){ g.beginPath(); g.moveTo((x+r)*s,y*s); g.arcTo((x+w)*s,y*s,(x+w)*s,(y+h)*s,r*s); g.arcTo((x+w)*s,(y+h)*s,x*s,(y+h)*s,r*s); g.arcTo(x*s,(y+h)*s,x*s,y*s,r*s); g.arcTo(x*s,y*s,(x+w)*s,y*s,r*s); g.closePath(); g.fill(); }
  rr(120,206,48,100,14); rr(344,206,48,100,14); rr(84,226,36,60,12); rr(392,226,36,60,12); rr(168,238,176,36,10);
  g.fillStyle="#F6C26B"; g.beginPath(); var cx=256,cy=150,R=46,r=20; for(var i=0;i<10;i++){ var a=-Math.PI/2+i*Math.PI/5, rad=i%2?r:R; g.lineTo((cx+Math.cos(a)*rad)*s,(cy+Math.sin(a)*rad)*s); } g.closePath(); g.fill();
  g.fillStyle="#FFF8F1"; g.font="bold "+Math.round(56*s)+"px Arial, Helvetica, sans-serif"; g.textAlign="center"; g.fillText("MY WORKOUT",256*s,392*s);
  try{ return cv.toDataURL("image/png"); }catch(e){ return null; }
}
try{
  var i192=makeIcon(192), i512=makeIcon(512);
  if(i192&&i512){
    $("#touchicon").href=i192;
    if(/^https?:/.test(location.protocol)){
      var here=location.href.split("#")[0];
      var man={name:"My Workout",short_name:"My Workout",description:"12-week Gym and Travel / Home workout programs",start_url:here,scope:here.replace(/[^\/]*$/,""),display:"standalone",orientation:"portrait",background_color:"#FFF8F1",theme_color:"#C8553D",
        icons:[{src:i192,sizes:"192x192",type:"image/png",purpose:"any"},{src:i512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
      $("#manifest").href="data:application/manifest+json,"+encodeURIComponent(JSON.stringify(man));
    }
  }
}catch(e){}

renderAll();
showTab(state.tab||"d1");
})();
